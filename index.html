<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<title>QAVLI Pro</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #e5ddd5;
  --card: #ffffff;
  --ink: #111b21;
  --mute: #667781;
  --line: #e9edef;
  --brand: #075e54;
  --header-bg: #008069;
  --mine: #dcf8c6;
  --other: #ffffff;
  --accent: #25d366;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b141a;
    --card: #111b21;
    --ink: #e9edef;
    --mute: #8696a0;
    --line: #222d34;
    --brand: #1f2c34;
    --header-bg: #202c33;
    --mine: #005c4b;
    --other: #202c33;
    --accent: #00a884;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); }
.v { display: none; height: 100%; flex-direction: column; max-width: 600px; margin: 0 auto; background: var(--bg); }
.v.on { display: flex; }
.pad { padding: 40px 24px; justify-content: center; background: var(--card); }
.logo { width: 70px; height: 70px; border-radius: 50%; background: var(--accent); color: #fff; font: bold 36px/70px sans-serif; text-align: center; margin: 0 auto 16px; }
h1 { text-align: center; margin-bottom: 6px; font-size: 26px; }
.mute { text-align: center; color: var(--mute); margin-bottom: 24px; font-size: 14px; }
input { width: 100%; font: inherit; padding: 14px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); outline: none; }
input:focus { border-color: var(--accent); }
button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 14px; background: var(--accent); color: #fff; font-weight: 600; width: 100%; }
button.sec { background: transparent; color: var(--ink); border: 1px solid var(--line); margin-top: 8px; }
.err { color: #ea0038; font-size: 13px; text-align: center; min-height: 20px; margin-bottom: 10px; }

/* Header & Navigation */
.bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--header-bg); color: #fff; }
.bar h2 { font-size: 18px; flex: 1; font-weight: 600; }
.bar button { width: auto; padding: 8px 12px; font-size: 13px; background: rgba(255,255,255,0.15); color: #fff; }
.tools { padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
.tools input { margin: 0; padding: 10px; }
.scroll { flex: 1; overflow-y: auto; background: var(--card); }
.row { display: flex; width: 100%; align-items: center; gap: 14px; padding: 14px 16px; border: 0; background: transparent; color: var(--ink); border-bottom: 1px solid var(--line); text-align: left; }
.row:active { background: var(--line); }
.row b { display: block; font-size: 16px; }
.row small { color: var(--mute); font-size: 13px; }
.av { width: 46px; height: 46px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: bold; font-size: 20px; flex: none; }

/* Chat Screen */
#msgs { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 80%; align-self: flex-start; background: var(--other); padding: 8px 12px; border-radius: 0px 12px 12px 12px; font-size: 15px; word-break: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
.msg.me { align-self: flex-end; background: var(--mine); border-radius: 12px 0px 12px 12px; }
.msg a { color: #0366d6; text-decoration: underline; }
.who { display: block; font-size: 12px; font-weight: bold; color: var(--accent); margin-bottom: 2px; }
.time { display: block; text-align: right; font-size: 10px; color: var(--mute); margin-top: 4px; }
form { display: flex; gap: 8px; padding: 10px 12px; background: var(--header-bg); }
form input { margin: 0; border-radius: 20px; padding: 12px 16px; }
form button { width: auto; border-radius: 50%; padding: 12px 16px; }
.empty { color: var(--mute); text-align: center; padding: 40px 20px; font-size: 14px; }
</style>
</head>
<body>

<!-- LOGIN / SIGNUP -->
<div id="vauth" class="v on pad">
  <div class="logo">Q</div>
  <h1>QAVLI Pro</h1>
  <p class="mute">Connect with friends instantly</p>
  <input id="em" type="email" placeholder="Email">
  <input id="pw" type="password" placeholder="Password (6+ chars)">
  <div class="err" id="aerr"></div>
  <button id="bin">Sign In</button>
  <button id="bup" class="sec">Create Account</button>
</div>

<!-- SETUP PROFILE -->
<div id="vsetup" class="v pad">
  <h1>Your Profile</h1>
  <p class="mute">Enter your display name to continue</p>
  <input id="pname" type="text" placeholder="Your Name">
  <div class="err" id="perr"></div>
  <button id="bprof">Save Profile</button>
</div>

<!-- MAIN HOME (CHATS) -->
<div id="vhome" class="v">
  <div class="bar">
    <h2>QAVLI Pro</h2>
    <button id="bgp">+ Group</button>
    <button id="bout">Logout</button>
  </div>
  <div class="tools">
    <input id="src" type="search" placeholder="Search chats or users...">
  </div>
  <div class="scroll" id="clist"></div>
</div>

<!-- CHAT SCREEN -->
<div id="vchat" class="v">
  <div class="bar">
    <button id="bback">←</button>
    <h2 id="ctitle">Chat</h2>
  </div>
  <div id="msgs"></div>
  <form id="fm">
    <input id="mi" type="text" placeholder="Type a message..." autocomplete="off">
    <button type="submit">➤</button>
  </form>
</div>

<!-- NEW GROUP MODAL -->
<div id="vgp" class="v pad">
  <h1>New Group</h1>
  <p class="mute">Create a new group chat</p>
  <input id="gtitle" type="text" placeholder="Group Name">
  <div class="err" id="gerr"></div>
  <button id="bgc">Create Group</button>
  <button id="bgcan" class="sec">Cancel</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, 
  onAuthStateChanged, 
  createUserWithEmailAndPassword, 
  signInWithEmailAndPassword, 
  signOut,
  setPersistence,
  browserLocalPersistence 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  getDoc, 
  getDocs, 
  setDoc, 
  addDoc, 
  collection, 
  query, 
  where, 
  orderBy, 
  onSnapshot, 
  serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3DT-yjo96atEA6V7K63x9lofg87ESjcA",
  authDomain: "qavli-37983.firebaseapp.com",
  projectId: "qavli-37983",
  appId: "1:168938701514:web:783d81a63d8e4423e56a33"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Enable persistent session so users stay logged in
setPersistence(auth, browserLocalPersistence).catch(console.error);

const $ = s => document.querySelector(s);
let me = null, prof = null, cur = null, unC = null, unL = null, names = {};

function el(tag, cls, text) { 
  const e = document.createElement(tag); 
  if (cls) e.className = cls; 
  if (text) e.textContent = text; 
  return e; 
}

function show(id) { 
  document.querySelectorAll('.v').forEach(v => v.classList.toggle('on', v.id === id)); 
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function renderText(text) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
}

// Authentication Listeners
onAuthStateChanged(auth, async u => {
  me = u;
  if (!u) { 
    show('vauth'); 
    return; 
  }
  const snap = await getDoc(doc(db, 'users', u.uid));
  if (!snap.exists()) {
    show('vsetup');
  } else {
    prof = snap.data();
    loadHome();
  }
});

$('#bin').onclick = async () => {
  $('#aerr').textContent = '';
  try { 
    await signInWithEmailAndPassword(auth, $('#em').value, $('#pw').value); 
  } catch(e) { 
    $('#aerr').textContent = e.message.replace('Firebase: ', ''); 
  }
};

$('#bup').onclick = async () => {
  $('#aerr').textContent = '';
  try { 
    await createUserWithEmailAndPassword(auth, $('#em').value, $('#pw').value); 
  } catch(e) { 
    $('#aerr').textContent = e.message.replace('Firebase: ', ''); 
  }
};

$('#bprof').onclick = async () => {
  const n = $('#pname').value.trim();
  if (!n) return $('#perr').textContent = 'Please enter a name';
  prof = { name: n, email: me.email, uid: me.uid };
  await setDoc(doc(db, 'users', me.uid), prof);
  loadHome();
};

$('#bout').onclick = () => signOut(auth);

// Home Screen & Chat List
async function loadHome() {
  show('vhome');
  if (unL) unL();
  
  const uSnap = await getDocs(collection(db, 'users'));
  uSnap.forEach(d => { names[d.id] = d.data().name || 'User'; });

  unL = onSnapshot(collection(db, 'chats'), snap => {
    const clist = $('#clist');
    clist.innerHTML = '';
    let list = [];
    snap.forEach(d => {
      const c = { id: d.id, ...d.data() };
      if (c.type === 'group' || (c.members && c.members.includes(me.uid))) {
        list.push(c);
      }
    });

    if (!list.length) {
      clist.appendChild(el('div', 'empty', 'No active chats. Search for users to start chatting!'));
      return;
    }

    list.forEach(c => {
      const row = el('button', 'row');
      const av = el('div', 'av', (c.title || 'C')[0].toUpperCase());
      const meta = el('div');
      
      let title = c.title;
      if (c.type === 'direct') {
        const otherId = c.members.find(m => m !== me.uid);
        title = names[otherId] || 'Direct Chat';
      }
      
      meta.appendChild(el('b', '', title));
      meta.appendChild(el('small', '', c.lastMsg || 'Tap to open chat'));
      
      row.appendChild(av);
      row.appendChild(meta);
      row.onclick = () => openChat(c.id, title);
      clist.appendChild(row);
    });
  });
}

// Open Chat
function openChat(cid, title) {
  cur = cid;
  $('#ctitle').textContent = title;
  show('vchat');
  
  if (unC) unC();
  const q = query(collection(db, 'chats', cid, 'messages'), orderBy('time', 'asc'));
  
  unC = onSnapshot(q, snap => {
    const box = $('#msgs');
    box.innerHTML = '';
    snap.forEach(d => {
      const m = d.data();
      const isMe = m.sender === me.uid;
      const div = el('div', `msg ${isMe ? 'me' : ''}`);
      
      if (!isMe) div.appendChild(el('span', 'who', names[m.sender] || 'User'));
      
      const txt = el('span');
      txt.innerHTML = renderText(m.text || '');
      div.appendChild(txt);
      
      div.appendChild(el('span', 'time', fmtTime(m.time)));
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  });
}

$('#fm').onsubmit = async e => {
  e.preventDefault();
  const input = $('#mi');
  const text = input.value.trim();
  if (!text || !cur) return;
  input.value = '';
  
  await addDoc(collection(db, 'chats', cur, 'messages'), {
    text,
    sender: me.uid,
    time: serverTimestamp()
  });
  
  await setDoc(doc(db, 'chats', cur), {
    lastMsg: text,
    updatedAt: serverTimestamp()
  }, { merge: true });
};

$('#bback').onclick = () => loadHome();

// Group Creation
$('#bgp').onclick = () => show('vgp');
$('#bgcan').onclick = () => loadHome();

$('#bgc').onclick = async () => {
  const t = $('#gtitle').value.trim();
  if (!t) return $('#gerr').textContent = 'Enter group name';
  
  const ref = await addDoc(collection(db, 'chats'), {
    title: t,
    type: 'group',
    created: serverTimestamp(),
    members: [me.uid]
  });
  
  $('#gtitle').value = '';
  openChat(ref.id, t);
};
</script>
</body>
    </html>
