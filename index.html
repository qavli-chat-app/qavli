<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<title>QAVLI Enterprise Pro</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #0b141a;
  --card: #111b21;
  --ink: #e9edef;
  --mute: #8696a0;
  --line: #222d34;
  --header-bg: #202c33;
  --mine: #005c4b;
  --other: #202c33;
  --accent: #00a884;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }

/* TOP PROGRESS BAR (PATTI) */
#loader-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 0%;
  height: 3px;
  background: var(--accent);
  z-index: 9999;
  transition: width 0.3s ease;
}

.v { display: none; height: 100%; flex-direction: column; max-width: 600px; margin: 0 auto; background: var(--bg); position: relative; }
.v.on { display: flex; }
.pad { padding: 40px 24px; justify-content: center; background: var(--card); }
.logo { width: 70px; height: 70px; border-radius: 50%; background: var(--accent); color: #fff; font: bold 36px/70px sans-serif; text-align: center; margin: 0 auto 16px; }
h1 { text-align: center; margin-bottom: 6px; font-size: 26px; }
.mute { text-align: center; color: var(--mute); margin-bottom: 24px; font-size: 14px; }
input, textarea { width: 100%; font: inherit; padding: 14px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); outline: none; }
input:focus, textarea:focus { border-color: var(--accent); }
button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 14px; background: var(--accent); color: #fff; font-weight: 600; width: 100%; }
button.sec { background: transparent; color: var(--ink); border: 1px solid var(--line); margin-top: 8px; }
.err { color: #ea0038; font-size: 13px; text-align: center; min-height: 20px; margin-bottom: 10px; }

/* Header & Navigation */
.bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--header-bg); color: #fff; }
.bar h2 { font-size: 18px; flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar button { width: auto; padding: 8px 12px; font-size: 13px; background: rgba(255,255,255,0.15); color: #fff; }
.tools { padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
.tools input { margin: 0; padding: 10px; }
.scroll { flex: 1; overflow-y: auto; background: var(--card); padding-bottom: 65px; }
.row { display: flex; width: 100%; align-items: center; gap: 14px; padding: 14px 16px; border: 0; background: transparent; color: var(--ink); border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; }
.row:active { background: var(--line); }
.row b { display: block; font-size: 16px; }
.row small { color: var(--mute); font-size: 13px; }
.av-box { position: relative; flex: none; }
.av { width: 46px; height: 46px; border-radius: 50%; background: #008069; color: #fff; display: grid; place-items: center; font-weight: bold; font-size: 20px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #25d366; position: absolute; bottom: 0; right: 0; border: 2px solid var(--card); }

/* Chat Area */
#msgs { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 80%; align-self: flex-start; background: var(--other); padding: 8px 12px; border-radius: 0px 12px 12px 12px; font-size: 15px; word-break: break-word; }
.msg.me { align-self: flex-end; background: var(--mine); border-radius: 12px 0px 12px 12px; }
.msg a { color: #53bdeb; text-decoration: underline; }
.who { display: block; font-size: 12px; font-weight: bold; color: var(--accent); margin-bottom: 2px; }
.time { display: block; text-align: right; font-size: 10px; color: var(--mute); margin-top: 4px; }
form { display: flex; gap: 8px; padding: 10px 12px; background: var(--header-bg); }
form input { margin: 0; border-radius: 20px; padding: 12px 16px; }
form button { width: auto; border-radius: 50%; padding: 12px 16px; }
.empty { color: var(--mute); text-align: center; padding: 40px 20px; font-size: 14px; }

/* Navigation Tabs */
.tabs { display: flex; position: absolute; bottom: 0; left: 0; right: 0; background: var(--header-bg); border-top: 1px solid var(--line); height: 55px; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--mute); font-size: 11px; background: none; border: 0; padding: 0; }
.tab.act { color: var(--accent); font-weight: bold; }
.tab-icon { font-size: 18px; margin-bottom: 2px; }
.icon-btn { background: transparent; border: 0; color: #fff; font-size: 18px; padding: 4px; width: auto; cursor: pointer; }
</style>
</head>
<body>

<div id="loader-bar"></div>

<!-- AUTH SCREEN -->
<div id="vauth" class="v on pad">
  <div class="logo">Q</div>
  <h1>QAVLI Pro</h1>
  <p class="mute">Enterprise Messaging App</p>
  <input id="em" type="email" placeholder="Email">
  <input id="pw" type="password" placeholder="Password (6+ chars)">
  <div class="err" id="aerr"></div>
  <button id="bin">Sign In</button>
  <button id="bup" class="sec">Create Account</button>
</div>

<!-- PROFILE & USERNAME SETUP -->
<div id="vsetup" class="v pad">
  <h1>Create Profile</h1>
  <p class="mute">Set your Unique Username (a-z, 0-9, _)</p>
  <input id="pusername" type="text" placeholder="Username (e.g. john_doe)">
  <input id="pdisplay" type="text" placeholder="Display Name (e.g. John Doe)">
  <div class="err" id="perr"></div>
  <button id="bprof">Save Profile</button>
</div>

<!-- HOME SCREEN -->
<div id="vhome" class="v">
  <div class="bar">
    <h2 id="htitle">QAVLI Chats</h2>
    <button id="bgp" style="display:none;">+ Group</button>
  </div>
  
  <div class="tools" id="srchbox">
    <input id="src" type="search" placeholder="Search users by username...">
  </div>

  <div class="scroll" id="tabcontent"></div>

  <div class="tabs">
    <button class="tab act" id="tchats">
      <span class="tab-icon">💬</span>
      <span>Chats</span>
    </button>
    <button class="tab" id="tgroups">
      <span class="tab-icon">👥</span>
      <span>Groups</span>
    </button>
    <button class="tab" id="tstatus">
      <span class="tab-icon">⭕</span>
      <span>Status</span>
    </button>
    <button class="tab" id="tprof">
      <span class="tab-icon">⚙️</span>
      <span>Profile</span>
    </button>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="vchat" class="v">
  <div class="bar">
    <button id="bback" style="width:auto; padding:6px 12px;">←</button>
    <h2 id="ctitle">Chat</h2>
    <button class="icon-btn" id="binvite" title="Share Group Invite Link" style="display:none;">🔗</button>
  </div>
  <div id="msgs"></div>
  <form id="fm">
    <input id="mi" type="text" placeholder="Type a message..." autocomplete="off">
    <button type="submit">➤</button>
  </form>
</div>

<!-- NEW GROUP MODAL -->
<div id="vgp" class="v pad">
  <h1>New Group</h1>
  <p class="mute">Create a new secure group</p>
  <input id="gtitle" type="text" placeholder="Group Name">
  <div class="err" id="gerr"></div>
  <button id="bgc">Create Group</button>
  <button id="bgcan" class="sec">Cancel</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, 
  onAuthStateChanged, 
  createUserWithEmailAndPassword, 
  signInWithEmailAndPassword, 
  signOut,
  setPersistence,
  browserLocalPersistence 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  getDoc, 
  getDocs, 
  setDoc, 
  addDoc, 
  writeBatch,
  collection, 
  query, 
  where, 
  orderBy, 
  onSnapshot, 
  serverTimestamp,
  arrayUnion 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3DT-yjo96atEA6V7K63x9lofg87ESjcA",
  authDomain: "qavli-37983.firebaseapp.com",
  projectId: "qavli-37983",
  appId: "1:168938701514:web:783d81a63d8e4423e56a33"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

setPersistence(auth, browserLocalPersistence).catch(console.error);

const $ = s => document.querySelector(s);
let me = null, prof = null, cur = null, curChatData = null, unC = null, unL = null, names = {}, currentTab = 'chats', usersCache = [];

function startLoading() {
  const bar = $('#loader-bar');
  bar.style.width = '30%';
  setTimeout(() => bar.style.width = '70%', 200);
}

function stopLoading() {
  const bar = $('#loader-bar');
  bar.style.width = '100%';
  setTimeout(() => { bar.style.width = '0%'; }, 400);
}

function el(tag, cls, text) { 
  const e = document.createElement(tag); 
  if (cls) e.className = cls; 
  if (text) e.textContent = text; 
  return e; 
}

function show(id) { 
  document.querySelectorAll('.v').forEach(v => v.classList.toggle('on', v.id === id)); 
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function renderText(text) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
}

/* AUTHENTICATION LISTENER */
onAuthStateChanged(auth, async u => {
  startLoading();
  me = u;
  if (!u) { 
    show('vauth');
    stopLoading(); 
    return; 
  }
  const snap = await getDoc(doc(db, 'users', u.uid));
  if (!snap.exists()) {
    show('vsetup');
  } else {
    prof = snap.data();
    setDoc(doc(db, 'users', me.uid), { isOnline: true }, { merge: true }).catch(() => {});
    
    // Process Invite Link Join Query
    const params = new URLSearchParams(window.location.search);
    const groupId = params.get('group');
    if (groupId) {
      await handleGroupInvite(groupId);
    } else {
      loadHome();
    }
  }
  stopLoading();
});

/* JOIN GROUP VIA LINK ACCORDING TO RULES */
async function handleGroupInvite(groupId) {
  try {
    const gRef = doc(db, 'chats', groupId);
    const gSnap = await getDoc(gRef);
    if (gSnap.exists() && gSnap.data().isGroup) {
      await setDoc(gRef, {
        members: arrayUnion(me.uid)
      }, { merge: true });
      openChat(groupId, gSnap.data().name, gSnap.data());
      return;
    }
  } catch(e) {
    console.error("Invite error", e);
  }
  loadHome();
}

$('#bin').onclick = async () => {
  startLoading();
  $('#aerr').textContent = '';
  try { 
    await signInWithEmailAndPassword(auth, $('#em').value, $('#pw').value); 
  } catch(e) { 
    $('#aerr').textContent = e.message.replace('Firebase: ', ''); 
  }
  stopLoading();
};

$('#bup').onclick = async () => {
  startLoading();
  $('#aerr').textContent = '';
  try { 
    await createUserWithEmailAndPassword(auth, $('#em').value, $('#pw').value); 
  } catch(e) { 
    $('#aerr').textContent = e.message.replace('Firebase: ', ''); 
  }
  stopLoading();
};

/* ATOMIC USERNAME & PROFILE SAVE (BATCH TRANSACTION) */
$('#bprof').onclick = async () => {
  startLoading();
  $('#perr').textContent = '';
  const uname = $('#pusername').value.trim().toLowerCase();
  const dname = $('#pdisplay').value.trim();
  
  if (!/^[a-z0-9_]{3,20}$/.test(uname)) {
    stopLoading();
    return $('#perr').textContent = 'Username must be 3-20 chars (a-z, 0-9, _ only)';
  }
  if (!dname || dname.length > 40) {
    stopLoading();
    return $('#perr').textContent = 'Display Name required (max 40 chars)';
  }

  try {
    const batch = writeBatch(db);
    const userRef = doc(db, 'users', me.uid);
    const usernameRef = doc(db, 'usernames', uname);

    batch.set(userRef, {
      username: uname,
      displayName: dname,
      createdAt: serverTimestamp(),
      isOnline: true
    });

    batch.set(usernameRef, {
      uid: me.uid,
      createdAt: serverTimestamp()
    });

    await batch.commit();
    prof = { username: uname, displayName: dname, isOnline: true };
    loadHome();
  } catch (e) {
    $('#perr').textContent = 'Username already taken or invalid transaction.';
  }
  stopLoading();
};

async function loadHome() {
  show('vhome');
  switchTab(currentTab);
}

function setTabActive(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('act'));
  $(id).classList.add('act');
}

$('#tchats').onclick = () => switchTab('chats');
$('#tgroups').onclick = () => switchTab('groups');
$('#tstatus').onclick = () => switchTab('status');
$('#tprof').onclick = () => switchTab('prof');

async function switchTab(tab) {
  startLoading();
  currentTab = tab;
  if (unL) unL();
  const box = $('#tabcontent');
  box.innerHTML = '';
  $('#bgp').style.display = 'none';
  $('#srchbox').style.display = 'block';

  if (tab === 'chats') {
    setTabActive('#tchats');
    $('#htitle').textContent = 'QAVLI Chats';
    await fetchAllUsers();
    loadChatsTab();
  } else if (tab === 'groups') {
    setTabActive('#tgroups');
    $('#htitle').textContent = 'Groups';
    $('#bgp').style.display = 'block';
    loadGroupsTab();
  } else if (tab === 'status') {
    setTabActive('#tstatus');
    $('#htitle').textContent = 'Status';
    $('#srchbox').style.display = 'none';
    loadStatusTab();
  } else if (tab === 'prof') {
    setTabActive('#tprof');
    $('#htitle').textContent = 'My Profile';
    $('#srchbox').style.display = 'none';
    loadProfileTab();
  }
  stopLoading();
}

async function fetchAllUsers() {
  const uSnap = await getDocs(collection(db, 'users'));
  usersCache = [];
  uSnap.forEach(d => { 
    names[d.id] = d.data().displayName || d.data().username || 'User'; 
    if (d.id !== me.uid) usersCache.push({ id: d.id, ...d.data() });
  });
}

function loadChatsTab() {
  const q = query(collection(db, 'chats'), where('members', 'array-contains', me.uid));
  unL = onSnapshot(q, snap => {
    renderChatsList(snap);
  });
}

function renderChatsList(snap) {
  const box = $('#tabcontent');
  box.innerHTML = '';
  let list = [];
  if (snap) {
    snap.forEach(d => {
      const c = { id: d.id, ...d.data() };
      if (c.isGroup === false) list.push(c);
    });
  }

  const queryStr = $('#src').value.toLowerCase().trim();
  if (queryStr) {
    const matchedUsers = usersCache.filter(u => 
      (u.username || '').toLowerCase().includes(queryStr) || 
      (u.displayName || '').toLowerCase().includes(queryStr)
    );
    if (matchedUsers.length) {
      matchedUsers.forEach(u => {
        const row = el('button', 'row');
        const avBox = el('div', 'av-box');
        const nameToShow = u.displayName || u.username;
        avBox.appendChild(el('div', 'av', nameToShow[0].toUpperCase()));
        if (u.isOnline) avBox.appendChild(el('div', 'dot'));
        
        const meta = el('div');
        meta.appendChild(el('b', '', nameToShow));
        meta.appendChild(el('small', '', '@' + u.username + ' • Tap to Chat'));
        row.appendChild(avBox);
        row.appendChild(meta);
        row.onclick = () => startDirectChat(u.id);
        box.appendChild(row);
      });
      return;
    }
  }

  if (!list.length) {
    box.appendChild(el('div', 'empty', 'No active chats. Search username above!'));
    return;
  }

  list.forEach(c => {
    const otherId = c.members.find(m => m !== me.uid);
    const title = names[otherId] || 'Direct Chat';
    const row = el('button', 'row');
    const avBox = el('div', 'av-box');
    avBox.appendChild(el('div', 'av', title[0].toUpperCase()));
    
    const meta = el('div');
    meta.appendChild(el('b', '', title));
    meta.appendChild(el('small', '', (c.lastMessage && c.lastMessage.text) ? c.lastMessage.text : 'Tap to open chat'));
    row.appendChild(avBox);
    row.appendChild(meta);
    row.onclick = () => openChat(c.id, title, c);
    box.appendChild(row);
  });
}

$('#src').oninput = () => {
  if (currentTab === 'chats') renderChatsList(null);
};

/* DETERMINISTIC DIRECT CHAT ID: UID1_UID2 */
async function startDirectChat(otherUid) {
  startLoading();
  const sortedUids = [me.uid, otherUid].sort();
  const deterministicChatId = sortedUids[0] + '_' + sortedUids[1];
  
  const cRef = doc(db, 'chats', deterministicChatId);
  const cSnap = await getDoc(cRef);

  if (cSnap.exists()) {
    openChat(deterministicChatId, names[otherUid] || 'Chat', cSnap.data());
  } else {
    const chatPayload = {
      isGroup: false,
      name: 'Direct Chat',
      members: sortedUids,
      createdBy: me.uid,
      createdAt: serverTimestamp(),
      lastMessage: { text: '', senderId: me.uid, at: '' },
      adminIds: [me.uid]
    };
    await setDoc(cRef, chatPayload);
    openChat(deterministicChatId, names[otherUid] || 'Chat', chatPayload);
  }
  stopLoading();
}

function loadGroupsTab() {
  const q = query(collection(db, 'chats'), where('members', 'array-contains', me.uid));
  unL = onSnapshot(q, snap => {
    const box = $('#tabcontent');
    box.innerHTML = '';
    let list = [];
    snap.forEach(d => {
      const c = { id: d.id, ...d.data() };
      if (c.isGroup === true) list.push(c);
    });

    if (!list.length) {
      box.appendChild(el('div', 'empty', 'No groups joined yet. Click "+ Group" to create.'));
      return;
    }

    list.forEach(c => {
      const row = el('button', 'row');
      const avBox = el('div', 'av-box');
      avBox.appendChild(el('div', 'av', (c.name || 'G')[0].toUpperCase()));
      const meta = el('div');
      meta.appendChild(el('b', '', c.name || 'Group'));
      meta.appendChild(el('small', '', (c.lastMessage && c.lastMessage.text) ? c.lastMessage.text : 'Tap to open group'));
      row.appendChild(avBox);
      row.appendChild(meta);
      row.onclick = () => openChat(c.id, c.name, c);
      box.appendChild(row);
    });
  });
}

function loadStatusTab() {
  const box = $('#tabcontent');
  box.innerHTML = `
    <div style="padding:16px;">
      <div class="row" style="border:none; padding:0; margin-bottom:20px;">
        <div class="av-box"><div class="av">+</div></div>
        <div><b>My Status</b><small>Tap to share an update</small></div>
      </div>
      <p class="mute" style="text-align:left;">Recent Updates</p>
      <div class="empty">No status updates available.</div>
    </div>
  `;
}

function loadProfileTab() {
  const box = $('#tabcontent');
  box.innerHTML = `
    <div style="padding:24px; text-align:center;">
      <div class="av" style="width:80px; height:80px; font-size:36px; margin:0 auto 16px;">${(prof.displayName || 'U')[0].toUpperCase()}</div>
      <h2>${prof.displayName || 'User'}</h2>
      <p class="mute">@${prof.username || 'username'}</p>
      <button id="btnlogout" style="margin-top:30px; background:#ea0038;">Logout</button>
    </div>
  `;
  $('#btnlogout').onclick = async () => {
    startLoading();
    await setDoc(doc(db, 'users', me.uid), { isOnline: false }, { merge: true });
    signOut(auth);
    stopLoading();
  };
}

function openChat(cid, title, data) {
  startLoading();
  cur = cid;
  curChatData = data;
  $('#ctitle').textContent = title;
  
  if (data && data.isGroup) {
    $('#binvite').style.display = 'inline-block';
  } else {
    $('#binvite').style.display = 'none';
  }
  
  show('vchat');
  
  if (unC) unC();
  const q = query(collection(db, 'chats', cid, 'messages'), orderBy('createdAt', 'asc'));
  
  unC = onSnapshot(q, snap => {
    const box = $('#msgs');
    box.innerHTML = '';
    snap.forEach(d => {
      const m = d.data();
      const isMe = m.senderId === me.uid;
      const div = el('div', `msg ${isMe ? 'me' : ''}`);
      
      if (!isMe) div.appendChild(el('span', 'who', names[m.senderId] || 'User'));
      
      const txt = el('span');
      txt.innerHTML = renderText(m.text || '');
      div.appendChild(txt);
      
      div.appendChild(el('span', 'time', fmtTime(m.createdAt)));
      box.appendChild(div);
    });
    box
