<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#14213d;--mute:#667089;--line:#dfe4ef;--brand:#14213d;--accent:#fca311;--mine:#fde3b0;--other:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0c1426;--card:#141f38;--ink:#edf1fa;--mute:#93a0bd;--line:#26334f;--brand:#0c1426;--mine:#6b4a0c;--other:#1b2845}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.v{display:none;height:100%;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg)}
.v.on{display:flex}
.pad{padding:calc(32px + env(safe-area-inset-top)) 24px 24px;justify-content:center}
.logo{width:64px;height:64px;border-radius:50% 50% 50% 14px;background:var(--accent);color:var(--brand);font:800 38px/64px Georgia,serif;text-align:center;margin-bottom:12px}
h1{margin:0 0 4px;font:700 28px Georgia,serif;letter-spacing:.5px}
.mute{color:var(--mute);margin:0 0 20px}
input{width:100%;font:inherit;padding:13px 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 16px;background:var(--accent);color:#14213d;font-weight:600}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:#d62839;min-height:22px;margin:6px 0}
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--brand);color:#fff}
.bar h2{margin:0;font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button{background:rgba(255,255,255,.14);color:#fff;padding:8px 12px}
.tools{padding:12px 14px 4px}
.tools input{margin:0}
.scroll{flex:1;overflow-y:auto;padding:6px 8px}
.row{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:transparent;color:var(--ink);font-weight:400;padding:11px 10px;border-radius:12px}
.row:hover{background:var(--card)}
.row b{display:block}
.row small{color:var(--mute)}
.av{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--accent);display:grid;place-items:center;font:700 18px Georgia,serif;flex:none;border:2px solid var(--accent)}
.empty{color:var(--mute);text-align:center;padding:30px 20px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:80%;align-self:flex-start;background:var(--other);padding:8px 12px;border-radius:16px 16px 16px 4px;overflow-wrap:anywhere;border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--mine);border-radius:16px 16px 4px 16px}
.msg a{color:inherit;text-decoration:underline}
.who{display:block;font-size:13px;color:var(--mute)}
.time{display:block;text-align:right;font-size:11px;color:var(--mute);font-style:normal}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
form input{margin:0}
</style>

 radial-gradient(circle at 15% 15%,rgba(242,169,59,.08),transparent 24%),
 radial-gradient(circle at 90% 80%,rgba(23,63,95,.06),transparent 26%),#eef3f7}

<style id="qavli-pro-max">

<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="vauth" class="v on pad">
  <div class="logo">Q</div>
  <h1>QAVLI</h1>
  <p class="mute">Private, simple and built for everyday conversations.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <div class="err" id="aerr" role="alert"></div>
  <button id="bin">Sign in</button>
  <p></p>
  <button id="bup" class="sec">Create account</button>
  <button id="forgot" class="link-btn" type="button">Forgot password?</button>
</div>

<div id="vsetup" class="v pad">
  <div class="logo">Q</div>
  <h1>Your profile</h1>
  <p class="mute">Friends find you by username.</p>
  <input id="un" placeholder="Username (a-z, 0-9, _)" maxlength="20" autocapitalize="none">
  <input id="dn" placeholder="Display name" maxlength="40"><input id="avatarFile" type="file" accept="image/*" hidden>
  <div class="err" id="serr" role="alert"></div>
  <button id="bsave">Save profile</button>
</div>

<div id="vhome" class="v">
  <div class="bar"><div class="brand-mini"><span class="brand-mark">Q</span><div><h2>QAVLI</h2><small>Private messaging</small></div></div><div class="bar-actions"><button id="notifyBtn" title="Enable notifications">🔔</button><button id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button><button id="profileBtn">Profile</button><button id="bgrp">New group</button><button id="out">Sign out</button></div></div>
  <div class="tools"><div class="section-title"><span>Messages</span><small>Stay connected</small></div><div class="search-wrap"><span>⌕</span><input id="q" placeholder="Search people by username" autocapitalize="none"></div></div>
  <div class="scroll"><div id="res"></div><div id="list"></div></div>
</div>

<div id="vchat" class="v">
  <div class="bar"><button id="back" aria-label="Back">Back</button><div class="chat-head-copy"><div id="chatAvatar" class="chat-avatar" aria-hidden="true">Q</div><div style="min-width:0;flex:1"><h2 id="ct"></h2><span id="presence" style="font-size:11px;opacity:.85"></span></div></div><button id="searchChat">Search</button><button id="manageGroup" hidden>Members</button><button id="inv" hidden>Invite</button></div><div id="chatSearch" hidden><input id="chatQuery" placeholder="Search messages"></div>
  <div id="typing" style="display:none;padding:4px 18px;font-size:12px;color:#718096">typing…</div><div id="msgs"></div><div id="replybar" hidden><span id="replyText"></span><button id="cancelReply" type="button">Cancel</button></div>
  <div id="composerMeta" class="composer-meta"><span id="charCount">0 / 2000</span><span id="connectionState">● Ready</span></div><form id="f"><label for="filePick" style="display:grid;place-items:center;width:50px;height:50px;border-radius:15px;background:#eef3f8;cursor:pointer;font-size:20px" title="Attach file">📎</label><input id="filePick" type="file" hidden accept="image/*,.pdf,.doc,.docx,.txt,.zip"><input id="in" placeholder="Message" maxlength="2000" autocomplete="off"><button>Send</button></form>
</div>

<script type="module">

async function doAuth(up) {
  const email = $('#em').value.trim(), pw = $('#pw').value; $('#aerr').textContent = '';
  if (!email || pw.length < 6) { $('#aerr').textContent = 'Enter an email and a password of 6+ characters.'; return; }
  try { up ? await createUserWithEmailAndPassword(auth, email, pw) : await signInWithEmailAndPassword(auth, email, pw); }
  catch (e) { $('#aerr').textContent = friendly(e.code); }
}
$('#bin').onclick = () => doAuth(false);
$('#bup').onclick = () => doAuth(true);
$('#forgot').onclick = async () => {
  const email=$('#em').value.trim(); if(!email)return toast('Enter your email first.');
  try{await sendPasswordResetEmail(auth,email);toast('Password reset email sent. Check your inbox.')}
  catch(e){toast(friendly(e.code))}
};
$('#out').onclick = async () => {try{await signOut(auth)}catch(e){toast('Could not sign out.')}};

onAuthStateChanged(auth, async u => {
  if (!u) {
    me = prof = cur = null; if (unC) unC(); if (unL) unL(); unC = unL = null; show('vauth'); return;
  }
  if (me && me.uid === u.uid) return;
  me = u;
  try {
    const s = await getDoc(doc(db, 'users', u.uid));
    if (!s.exists()) return show('vsetup');
    prof = s.data(); names[u.uid] = prof.displayName; profiles[u.uid] = prof; home();
  } catch (e) { $('#aerr').textContent = 'Could not load your profile (' + e.code + ')'; show('vauth'); }
});

$('#bsave').onclick = async () => {
  const username = $('#un').value.trim().toLowerCase(), displayName = $('#dn').value.trim();
  if (!/^[a-z0-9_]{3,20}$/.test(username) || !displayName) { $('#serr').textContent = 'Username: 3-20 letters, numbers or _. Display name is required.'; return; }
  try {
    await runTransaction(db, async t => {
      const un = doc(db, 'usernames', username);
      if ((await t.get(un)).exists()) throw new Error('taken');
      t.set(un, { uid: me.uid });
      t.set(doc(db, 'users', me.uid), { username, displayName });
    });
    prof = { username, displayName }; names[me.uid] = displayName; profiles[me.uid] = prof; home();
  } catch (e) { $('#serr').textContent = e.message === 'taken' ? 'That username is taken. Try another.' : 'Could not save (' + (e.code || e.message) + ')'; }
};

/* ---------- notifications ---------- */
function notificationSupported(){
  return "Notification" in window && "serviceWorker" in navigator && "PushManager" in window;
}
async function enableNotifications(){
  if(!notificationSupported()) return alert("Push notifications are not supported by this browser.");
  if(FCM_VAPID_KEY.startsWith("PASTE_")) return alert("QAVLI notifications are ready, but the Firebase Web Push VAPID public key has not been added yet.");
  try{
    const permission = await Notification.requestPermission();
    if(permission !== "granted") return alert("Notifications are blocked. Allow notifications for QAVLI in your browser settings.");
    const registration = await navigator.serviceWorker.register("sw.js?v=6");
    const token = await getToken(messaging,{vapidKey:FCM_VAPID_KEY,serviceWorkerRegistration:registration});
    if(!token) return alert("Could not create a notification subscription.");
    const tokenId = encodeURIComponent(token).slice(0,500);
    await setDoc(doc(db,"users",me.uid,"notificationTokens",tokenId),{
      token,
      link: location.origin + location.pathname,
      updatedAt:serverTimestamp()
    },{merge:true});
    $("#notifyBtn").textContent="🔔✓";
    $("#notifyBtn").title="Notifications enabled — tap to disable";
    $("#notifyBtn").onclick=disableNotifications;
    return true;
  }catch(e){
    console.error("QAVLI notification setup failed",e);
    alert("Could not enable notifications ("+(e.code||e.message||"unknown error")+")");
    return false;
  }
}
async function disableNotifications(){
  try{
    if(!notificationSupported()) return;
    const registration = await navigator.serviceWorker.register("sw.js?v=6");
    const token = await getToken(messaging,{vapidKey:FCM_VAPID_KEY,serviceWorkerRegistration:registration});
    if(token && me) await deleteDoc(doc(db,"users",me.uid,"notificationTokens",encodeURIComponent(token).slice(0,500))).catch(()=>{});
    await deleteToken(messaging).catch(()=>{});
    $("#notifyBtn").textContent="🔕";
    $("#notifyBtn").title="Enable notifications";
    $("#notifyBtn").onclick=enableNotifications;
  }catch(e){ alert("Could not disable notifications."); }
}
onMessage(messaging,payload=>{
  const n=payload.notification||{};
  if(document.visibilityState==="visible"){
    if("Notification" in window && Notification.permission==="granted"){
      try{ new Notification(n.title||"QAVLI",{
        body:n.body||"New message",
        icon:"icon.svg",
        tag:payload.data?.chatId||"qavli-message"
      }); }catch(e){}
    }
  }
});
$("#notifyBtn").onclick=enableNotifications;

/* ---------- home ---------- */
async function setPresence(state='online'){try{await setDoc(doc(db,'users',me.uid),{online:state==='online',lastSeen:serverTimestamp()},{merge:true})}catch(e){}}
function startPresence(){setPresence('online');const pulse=setInterval(()=>setPresence('online'),60000);window.addEventListener('beforeunload',()=>{clearInterval(pulse);setPresence('offline')},{once:true})}
function home() {
  show('vhome'); startPresence();
  if (unL) unL();
  unL = onSnapshot(query(collection(db, 'chats'), where('members', 'array-contains', me.uid)), snap => renderList(snap.docs),
    () => { $('#list').textContent = 'Could not load chats. Check your internet.'; });
  const params=new URLSearchParams(location.search), j=params.get('join'), chatId=params.get('chat');
  if(j||chatId)history.replaceState(null,'',location.pathname);
  if(j)joinLink(j);
  if(chatId)openDeepChat(chatId);
}
async function renderList(docs) {
  const items = docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ((b.lastActivityAt && b.lastActivityAt.seconds) || (b.createdAt && b.createdAt.seconds) || 0) - ((a.lastActivityAt && a.lastActivityAt.seconds) || (a.createdAt && a.createdAt.seconds) || 0));
  await ensureProfiles(items.filter(c => !c.isGroup).map(c => c.members.find(m => m !== me.uid)));
  const L = $('#list'); L.textContent = '';
  if (!items.length) { L.append(el('p', 'empty', 'No chats yet. Search a username above or create a group.')); return; }
  items.forEach(c => {
    const t = c.isGroup ? c.name : (names[c.members.find(m => m !== me.uid)] || 'Chat');
    L.append(row(t, c.isGroup ? 'Group, ' + c.members.length + ' members' : '', () => openChat(c, t), c.isGroup ? '' : (profiles[c.members.find(m=>m!==me.uid)]?.avatarUrl||'')));
  });
}

let st;
$('#q').oninput = () => { clearTimeout(st); st = setTimeout(search, 300); };
async function search() {
  const q = $('#q').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, ''), R = $('#res'); R.textContent = '';
  if (q.length < 2) return;
  try {
    const s = await getDocs(query(collection(db, 'users'), where('username', '>=', q), where('username', '<=', q + '\uf8ff'), limit(10)));
    let n = 0;
    s.forEach(d => { if (d.id === me.uid) return; n++; const p = d.data(); R.append(row(p.displayName, '@' + p.username, () => startDM(d.id, p.displayName), p.avatarUrl||'')); });
    if (!n) R.append(el('p', 'empty', 'No user found with that username.'));
  } catch (e) { R.append(el('p', 'empty', 'Search failed (' + e.code + ')')); }
}
async function startDM(other, title) {
  const m = [me.uid, other].sort(), id = m.join('_'), ref = doc(db, 'chats', id);
  try {
    const s = await getDoc(ref);
    if (!s.exists()) await setDoc(ref, { isGroup: false, members: m, createdAt: serverTimestamp(), lastActivityAt: serverTimestamp() });
  } catch (e) { return alert('Could not start chat: ' + (e.code || e.message)); }
  $('#q').value = ''; $('#res').textContent = '';
  openChat({ id, isGroup: false, members: m }, title);
}
$('#bgrp').onclick = async () => {
  const n = (prompt('Group name') || '').trim().slice(0, 60); if (!n) return;
  try {
    const r = await addDoc(collection(db, 'chats'), { isGroup: true, name: n, members: [me.uid], createdBy: me.uid, createdAt: serverTimestamp() });
    openChat({ id: r.id, isGroup: true, name: n, members: [me.uid] }, n);
  } catch (e) { alert('Could not create group (' + e.code + ')'); }
};
async function openDeepChat(id){try{const s=await getDoc(doc(db,'chats',id));if(!s.exists())return toast('That chat is no longer available.');const c={id,...s.data()};if(!c.members?.includes(me.uid))return toast('You are not a member of this chat.');const other=c.members.find(x=>x!==me.uid);if(other)await ensureProfiles([other]);openChat(c,c.isGroup?c.name:(names[other]||'Chat'));}catch(e){toast('Could not open chat ('+safeError(e)+')')}}
async function joinLink(id) {
  try {
    const ref = doc(db, 'chats', id), s = await getDoc(ref);
    if (!s.exists() || !s.data().isGroup) return toast('This invite link is not valid.');
    const c = { id, ...s.data() };
    if (c.members.includes(me.uid)) return openChat(c, c.name);
    if (!confirm('Join the group "' + c.name + '"?')) return;
    await updateDoc(ref, { members: arrayUnion(me.uid) });
    c.members=[...new Set([...(c.members||[]),me.uid])];
    openChat(c, c.name);
  } catch (e) { toast('Could not join (' + safeError(e) + ')'); }
}

/* ---------- chat ---------- */
function openChat(c, title) {
  cur = {...c,members:Array.isArray(c.members)?[...c.members]:[]}; $('#ct').textContent = title; $('#presence').textContent = ''; const avatar=$('#chatAvatar'); avatar.textContent=(title||'Q')[0].toUpperCase(); avatar.style.backgroundImage=''; const other=c.members?.find(x=>x!==me.uid); const avatarUrl=!c.isGroup ? (profiles[other]?.avatarUrl||c.memberProfiles?.[other]?.avatarUrl||'') : ''; if(avatarUrl){avatar.textContent='';avatar.style.backgroundImage=`url(${avatarUrl})`} $('#inv').hidden = !c.isGroup; $('#manageGroup').hidden = !c.isGroup; $('#msgs').textContent = ''; show('vchat');
  if(!c.isGroup&&other){if(unPresence)unPresence();unPresence=onSnapshot(doc(db,'users',other),s=>{const p=s.exists()?s.data():{};$('#presence').textContent=p.online?'● online':(p.lastSeen?.toDate?'last seen '+p.lastSeen.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'offline');},()=>{$('#presence').textContent=''});}
  if (unC) unC(); if(unTyping)unTyping(); listenTyping(c);
  unC = onSnapshot(query(collection(db, 'chats', c.id, 'messages'), orderBy('createdAt', 'desc'), limit(100)), async snap => {
    const ms = snap.docs.map(d => ({ id: d.id, pending: d.metadata.hasPendingWrites, ...d.data({ serverTimestamps: 'estimate' }) })).reverse();
    await ensureNames(ms.map(m => m.senderId));
    if (cur && cur.id === c.id) { renderMsgs(ms); ms.filter(m=>m.senderId!==me.uid&&!m.readBy?.[me.uid]).slice(-20).forEach(m=>updateDoc(doc(db,'chats',c.id,'messages',m.id),{['readBy.'+me.uid]:serverTimestamp()}).catch(()=>{})); }
  }, () => { $('#msgs').textContent = ''; $('#msgs').append(el('p', 'empty', 'Could not load messages. Go back and try again.')); });
}
function listenTyping(c){unTyping=onSnapshot(query(collection(db,'chats',c.id,'typing')),snap=>{$('#typing').style.display=snap.docs.some(d=>d.id!==me.uid&&d.data().until&&d.data().until.toMillis()>Date.now())?'block':'none'},()=>{$('#typing').style.display='none'})}
function setTyping(active){if(!cur)return;clearTimeout(typingTimer);if(active){setDoc(doc(db,'chats',cur.id,'typing',me.uid),{until:new Date(Date.now()+3500)}).catch(()=>{});typingTimer=setTimeout(()=>setTyping(false),2500)}else deleteDoc(doc(db,'chats',cur.id,'typing',me.uid)).catch(()=>{})}
function renderMsgs(ms) {
  currentMessages=ms; const filter=($('#chatQuery')?.value||'').trim().toLowerCase();
  const M=$('#msgs'), near=M.scrollHeight-M.scrollTop-M.clientHeight<150; M.textContent='';
  ms.filter(m=>!filter||(m.text||'').toLowerCase().includes(filter)).forEach(m=>{
    const mine=m.senderId===me.uid,d=el('div','msg'+(mine?' me':'')); d.dataset.id=m.id;
    if(m.deleted)d.classList.add('deleted');
    if(cur.isGroup&&!mine)d.append(el('b','who',names[m.senderId]||'Member'));
    if(m.replyTo)d.append(el('div','reply-preview','↩ '+(m.replyTo.text||'Message').slice(0,90)));
    if(m.imageUrl&&!m.deleted){const im=document.createElement('img');im.src=m.imageUrl;im.alt=m.fileName||'Shared image';im.loading='lazy';im.decoding='async';im.style='max-width:100%;max-height:320px;border-radius:12px;display:block;margin:4px 0;cursor:pointer';im.onclick=()=>window.open(m.imageUrl,'_blank','noopener');d.append(im)}
    if(m.fileUrl&&!m.deleted){const a=document.createElement('a');a.href=m.fileUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='📎 '+(m.fileName||'Download file');d.append(a)}
    if(m.deleted)d.append(el('span','', 'This message was deleted.'));
    else if(m.text)d.append(el('span','',m.text));
    const stamp=(m.pending?'Sending...':(m.createdAt&&m.createdAt.toDate?m.createdAt.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''))+(m.edited?' · edited':''); const readState=mine&&!m.pending?(Object.keys(m.readBy||{}).some(k=>k!==me.uid)?' · ✓✓':' · ✓'):''; d.append(el('i','time',stamp+readState));
    if(m.reaction)d.append(el('span','reaction',m.reaction));
    if(!m.deleted){const a=el('div','msg-tools'); const r=el('button','','↩');r.onclick=()=>setReply(m);const x=el('button','','☺');x.onclick=()=>reactMsg(m);const cp=el('button','','Copy');cp.onclick=()=>navigator.clipboard?.writeText(m.text||'');a.append(r,x,cp);if(mine){const ed=el('button','','Edit');ed.onclick=()=>editMsg(m);const dl=el('button','','Delete');dl.onclick=()=>removeMsg(m);a.append(ed,dl)}d.append(a)}
    M.append(d);
  }); if(near)M.scrollTop=M.scrollHeight;
}
function setReply(m){replyTo={id:m.id,text:m.text||''};$('#replyText').textContent='Replying: '+(m.text||'').slice(0,80);$('#replybar').hidden=false;$('#in').focus()}
async function editMsg(m){const v=prompt('Edit message',m.text||'');if(v===null||!v.trim())return;try{await updateDoc(doc(db,'chats',cur.id,'messages',m.id),{text:v.trim(),edited:true})}catch(e){alert('Could not edit ('+e.code+')')}}
async function removeMsg(m){if(!confirm('Delete this message for everyone?'))return;try{await updateDoc(doc(db,'chats',cur.id,'messages',m.id),{text:'',deleted:true})}catch(e){alert('Could not delete ('+e.code+')')}}
async function reactMsg(m){const choices=['❤️','👍','😂','😮','😢','🔥'];const current=m.reaction||'';const next=choices[(choices.indexOf(current)+1)%choices.length];try{await updateDoc(doc(db,'chats',cur.id,'messages',m.id),{reaction:next})}catch(e){toast('Could not react ('+safeError(e)+')')}}
$('#manageGroup').onclick=async()=>{if(!cur?.isGroup)return;if(cur.createdBy!==me.uid)return alert('Only the group creator can manage members.');const u=(prompt('Enter username to add')||'').trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(u))return;try{const s=await getDocs(query(collection(db,'users'),where('username','==',u),limit(1)));if(s.empty)return alert('User not found.');const uid=s.docs[0].id;if(cur.members.includes(uid))return alert('Already a member.');await updateDoc(doc(db,'chats',cur.id),{members:arrayUnion(uid)});cur.members.push(uid);alert('Member added.');}catch(e){alert('Could not add member ('+e.code+')')}};

$('#in').addEventListener('input',()=>setTyping(!!$('#in').value.trim()));
$('#filePick').onchange=async e=>{const file=e.target.files[0];if(!file||!cur)return;const allowed=/^(image\/|application\/pdf|text\/plain|application\/zip|application\/msword|application\/vnd\.openxmlformats-officedocument\.wordprocessingml\.document)/i;if(file.size>15*1024*1024){e.target.value='';return toast('File must be 15 MB or smaller.')}if(!allowed.test(file.type)){e.target.value='';return toast('This file type is not supported.')}try{const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const r=ref(storage,'chatFiles/'+cur.id+'/'+me.uid+'/'+Date.now()+'_'+safe);await uploadBytes(r,file);const url=await getDownloadURL(r);const data={senderId:me.uid,createdAt:serverTimestamp(),readBy:{[me.uid]:serverTimestamp()},fileUrl:url,fileName:file.name,fileType:file.type};if(file.type.startsWith('image/'))data.imageUrl=url;await addDoc(collection(db,'chats',cur.id,'messages'),data);await updateDoc(doc(db,'chats',cur.id),{lastActivityAt:serverTimestamp(),lastMessage:'📎 '+file.name.slice(0,100)});e.target.value='';toast('File sent.')}catch(err){toast('Upload failed ('+safeError(err)+')');e.target.value=''}};
$('#cancelReply').onclick=()=>{replyTo=null;$('#replybar').hidden=true}; $('#searchChat').onclick=()=>{$('#chatSearch').hidden=!$('#chatSearch').hidden; if(!$('#chatSearch').hidden)$('#chatQuery').focus()}; $('#chatQuery').oninput=()=>renderMsgs(currentMessages); $('#profileBtn').onclick=async()=>{const choice=prompt('Profile options:\n1 = Change display name\n2 = Change profile picture','1');if(choice==='1'){const n=prompt('Display name',prof?.displayName||'');if(n&&n.trim())updateDoc(doc(db,'users',me.uid),{displayName:n.trim()}).then(()=>{prof.displayName=n.trim();names[me.uid]=n.trim();profiles[me.uid]=prof}).catch(e=>alert('Could not update ('+e.code+')'))}else if(choice==='2')$('#avatarFile').click()};
$('#avatarFile').onchange=async e=>{const file=e.target.files[0];if(!file||!me)return;if(!file.type.startsWith('image/'))return alert('Please choose an image.');if(file.size>5*1024*1024)return alert('Profile picture must be 5 MB or smaller.');try{const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const r=ref(storage,'avatars/'+me.uid+'/'+Date.now()+'_'+safe);await uploadBytes(r,file);const url=await getDownloadURL(r);await updateDoc(doc(db,'users',me.uid),{avatarUrl:url});prof.avatarUrl=url;profiles[me.uid]=prof;alert('Profile picture updated.')}catch(err){toast('Could not upload picture ('+safeError(err)+')')}e.target.value=''};
$('#back').onclick = () => { if (unC) { unC(); unC = null; } if(unTyping){unTyping();unTyping=null} if(unPresence){unPresence();unPresence=null} setTyping(false); cur = null; show('vhome'); };
