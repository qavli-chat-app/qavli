<!doctype html>
<html lang="en">
<head>
  <meta name="theme-color" content="#173f5f">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="QAVLI — fast, private and modern messaging.">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

<meta charset="utf-8">

<title>QAVLI</title>
<link rel="manifest" href="manifest.json">

<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#14213d;--mute:#667089;--line:#dfe4ef;--brand:#14213d;--accent:#fca311;--mine:#fde3b0;--other:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0c1426;--card:#141f38;--ink:#edf1fa;--mute:#93a0bd;--line:#26334f;--brand:#0c1426;--mine:#6b4a0c;--other:#1b2845}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.v{display:none;height:100%;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg)}
.v.on{display:flex}
.pad{padding:calc(32px + env(safe-area-inset-top)) 24px 24px;justify-content:center}
.logo{width:64px;height:64px;border-radius:50% 50% 50% 14px;background:var(--accent);color:var(--brand);font:800 38px/64px Georgia,serif;text-align:center;margin-bottom:12px}
h1{margin:0 0 4px;font:700 28px Georgia,serif;letter-spacing:.5px}
.mute{color:var(--mute);margin:0 0 20px}
input{width:100%;font:inherit;padding:13px 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 16px;background:var(--accent);color:#14213d;font-weight:600}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:#d62839;min-height:22px;margin:6px 0}
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--brand);color:#fff}
.bar h2{margin:0;font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button{background:rgba(255,255,255,.14);color:#fff;padding:8px 12px}
.tools{padding:12px 14px 4px}
.tools input{margin:0}
.scroll{flex:1;overflow-y:auto;padding:6px 8px}
.row{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:transparent;color:var(--ink);font-weight:400;padding:11px 10px;border-radius:12px}
.row:hover{background:var(--card)}
.row b{display:block}
.row small{color:var(--mute)}
.av{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--accent);display:grid;place-items:center;font:700 18px Georgia,serif;flex:none;border:2px solid var(--accent)}
.empty{color:var(--mute);text-align:center;padding:30px 20px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:80%;align-self:flex-start;background:var(--other);padding:8px 12px;border-radius:16px 16px 16px 4px;overflow-wrap:anywhere;border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--mine);border-radius:16px 16px 4px 16px}
.msg a{color:inherit;text-decoration:underline}
.who{display:block;font-size:13px;color:var(--mute)}
.time{display:block;text-align:right;font-size:11px;color:var(--mute);font-style:normal}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
form input{margin:0}
</style>

<style id="qavli-pro-ui">
/* QAVLI 2.0 — visible premium interface layer */
:root{
  --bg:#f5f7fb;--card:#ffffff;--ink:#102f48;--mute:#718096;--line:#e5eaf1;
  --brand:#173f5f;--accent:#f2a93b;--mine:#eaf5ff;--other:#fff;
  --soft:#eef3f8;--shadow:0 18px 50px rgba(16,47,72,.10)
}
html,body{background:radial-gradient(circle at 20% 0%,rgba(242,169,59,.12),transparent 28%),var(--bg)}
.v{max-width:1180px;width:100%;margin:auto;background:rgba(245,247,251,.78);backdrop-filter:blur(18px)}
.v.on{animation:qavliIn .28s ease both}
@keyframes qavliIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{padding:clamp(28px,7vw,72px) clamp(20px,5vw,64px);align-items:center}
#vauth,#vsetup{max-width:520px;min-height:100%;background:transparent}
#vauth>* ,#vsetup>*{max-width:420px;width:100%}
.logo{width:78px;height:78px;line-height:78px;border-radius:24px 24px 24px 8px;background:linear-gradient(145deg,#f7bd55,#f2a93b);box-shadow:0 14px 32px rgba(242,169,59,.28);font:800 44px/78px Georgia,serif;margin-bottom:20px;transform:rotate(-2deg)}
h1{font:800 clamp(32px,7vw,46px)/1.05 Georgia,serif;letter-spacing:-1px}
.mute{font-size:15px;color:var(--mute);margin-bottom:26px}
#vauth input,#vsetup input{height:54px;padding:0 17px;border-radius:16px;background:rgba(255,255,255,.9);border:1px solid #dfe6ee;box-shadow:0 4px 16px rgba(16,47,72,.04)}
#vauth button,#vsetup button{height:54px;border-radius:16px;font-weight:750;box-shadow:0 8px 22px rgba(16,47,72,.12);transition:transform .18s,box-shadow .18s}
#vauth button:hover,#vsetup button:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(16,47,72,.16)}
#vauth button.sec{background:#fff}
.err{font-size:13px}
.bar{min-height:76px;padding:12px clamp(16px,3vw,28px);background:linear-gradient(135deg,#173f5f,#102f48);box-shadow:0 10px 28px rgba(16,47,72,.16);gap:12px}
.bar h2{font:800 22px/1 Georgia,serif;letter-spacing:.2px}
.bar h2:after{content:"  •  online";font:600 11px system-ui;color:#8de0b3;vertical-align:middle}
.bar button{border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:10px 13px;background:rgba(255,255,255,.10);transition:.18s}
.bar button:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
#vhome{background:linear-gradient(180deg,#f7f9fc 0,#f2f5f9 100%)}
.tools{padding:18px 18px 10px;background:rgba(255,255,255,.72);border-bottom:1px solid var(--line)}
.tools:before{content:"Messages";display:block;font:800 26px/1 Georgia,serif;color:var(--ink);margin:0 0 14px 2px}
.tools input{height:50px;border-radius:15px;padding-left:44px;background:#fff;box-shadow:0 7px 22px rgba(16,47,72,.06)}
.scroll{padding:10px 12px 28px}
.row{min-height:70px;margin:5px 0;padding:12px 13px;border:1px solid transparent;border-radius:18px;background:rgba(255,255,255,.74);box-shadow:0 4px 14px rgba(16,47,72,.035);transition:transform .18s,box-shadow .18s,border-color .18s,background .18s}
.row:hover{background:#fff;border-color:#e1e8ef;transform:translateY(-1px);box-shadow:0 10px 24px rgba(16,47,72,.08)}
.row b{font-size:15px}
.row small{display:block;margin-top:3px}
.av{width:48px;height:48px;border:0;border-radius:16px;background:linear-gradient(145deg,#173f5f,#245f85);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font:800 18px/48px Georgia,serif}
.empty{padding:54px 24px;background:rgba(255,255,255,.5);border:1px dashed #d8e0e9;border-radius:20px;margin:14px 4px}
#vchat{background:#eef3f7}
#vchat .bar{position:relative;z-index:2}
#ct{letter-spacing:.1px}
#msgs{padding:22px clamp(12px,4vw,42px);gap:9px;background:
 radial-gradient(circle at 15% 15%,rgba(242,169,59,.08),transparent 24%),
 radial-gradient(circle at 90% 80%,rgba(23,63,95,.06),transparent 26%),#eef3f7}
.msg{max-width:min(72%,560px);padding:10px 13px 7px;border:1px solid rgba(16,47,72,.07);border-radius:18px 18px 18px 5px;box-shadow:0 4px 13px rgba(16,47,72,.06);background:rgba(255,255,255,.94)}
.msg.me{background:#dceefa;border-radius:18px 18px 5px 18px;border-color:#c7e1f2}
.who{font-size:11px;font-weight:800;color:#39708f;margin-bottom:3px}
.time{margin-top:4px;font-size:10px;opacity:.7}
#f{padding:12px clamp(12px,3vw,28px) calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(14px);gap:9px}
#f input{height:50px;border-radius:16px;padding:0 16px;background:#f4f7fa;border:1px solid #e1e7ed}
#f button{min-width:78px;height:50px;border-radius:15px;background:var(--accent);box-shadow:0 7px 18px rgba(242,169,59,.25);font-weight:800}
@media(min-width:800px){
  #vhome,#vchat{border-left:1px solid #e2e8ef;border-right:1px solid #e2e8ef;box-shadow:var(--shadow)}
  #vhome{width:760px;max-width:calc(100% - 40px);border-radius:24px;min-height:calc(100% - 40px);margin:20px auto}
  #vchat{width:1000px;max-width:calc(100% - 40px);min-height:calc(100% - 40px);margin:20px auto;border-radius:24px;overflow:hidden}
}
@media(max-width:600px){
  .bar{min-height:68px}.bar button{padding:9px 10px;font-size:13px}.bar h2{font-size:20px}
  #vhome .bar button:first-of-type{display:none}
  .msg{max-width:86%}
}
@media(prefers-color-scheme:dark){
  :root{--bg:#09131f;--card:#111f2e;--ink:#edf4fa;--mute:#91a4b7;--line:#263747;--other:#152638;--mine:#173e58}
  html,body{background:#09131f}
  .v,#vhome{background:#0d1824}
  #vauth input,#vsetup input,.tools input{background:#122131;color:#edf4fa;border-color:#294052}
  .tools{background:rgba(13,24,36,.88);border-color:#263747}
  .row{background:rgba(18,33,49,.82)}.row:hover{background:#15283a}
  #msgs{background:#0b1722}.msg{background:#132535;border-color:#223849}.msg.me{background:#16405a}
  #f{background:rgba(13,24,36,.94)}#f input{background:#122131;color:#edf4fa;border-color:#294052}
}
@media(prefers-reduced-motion:reduce){.v.on,.row,#vauth button,#vsetup button,.bar button{animation:none;transition:none}}
</style>
</head>
<body>

<div id="vauth" class="v on pad">
  <div class="logo">Q</div>
  <h1>QAVLI</h1>
  <p class="mute">Sign in to start chatting.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <div class="err" id="aerr" role="alert"></div>
  <button id="bin">Sign in</button>
  <p></p>
  <button id="bup" class="sec">Create account</button>
</div>

<div id="vsetup" class="v pad">
  <div class="logo">Q</div>
  <h1>Your profile</h1>
  <p class="mute">Friends find you by username.</p>
  <input id="un" placeholder="Username (a-z, 0-9, _)" maxlength="20" autocapitalize="none">
  <input id="dn" placeholder="Display name" maxlength="40">
  <div class="err" id="serr" role="alert"></div>
  <button id="bsave">Save profile</button>
</div>

<div id="vhome" class="v">
  <div class="bar"><h2>QAVLI</h2><button id="profileBtn">Profile</button><button id="bgrp">New group</button><button id="out">Sign out</button></div>
  <div class="tools"><input id="q" placeholder="Find a person by username" autocapitalize="none"></div>
  <div class="scroll"><div id="res"></div><div id="list"></div></div>
</div>

<div id="vchat" class="v">
  <div class="bar"><button id="back" aria-label="Back">Back</button><h2 id="ct"></h2><button id="searchChat">Search</button><button id="inv" hidden>Invite</button></div><div id="chatSearch" hidden><input id="chatQuery" placeholder="Search messages"></div>
  <div id="msgs"></div><div id="replybar" hidden><span id="replyText"></span><button id="cancelReply" type="button">Cancel</button></div>
  <form id="f"><input id="in" placeholder="Message" maxlength="2000" autocomplete="off"><button>Send</button></form>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,collection,query,where,orderBy,limit,onSnapshot,serverTimestamp,arrayUnion,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3DT-yjo96atEA6V7K63x9lofg87ESjcA",
  authDomain: "qavli-37983.firebaseapp.com",
  projectId: "qavli-37983",
  appId: "1:168938701514:web:783d81a63d8e4423e56a33"
};
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
let me = null, prof = null, cur = null, unC = null, unL = null, names = {}, currentMessages = [], replyTo = null;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
function show(id) { document.querySelectorAll('.v').forEach(v => v.classList.toggle('on', v.id === id)); }
function row(title, sub, onclick) {
  const b = el('button', 'row'); b.append(el('div', 'av', (title || '?')[0].toUpperCase()));
  const t = el('div'); t.append(el('b', '', title)); if (sub) t.append(el('small', '', sub));
  b.append(t); b.onclick = onclick; return b;
}
async function ensureNames(ids) {
  await Promise.all([...new Set(ids)].filter(i => i && !names[i]).map(async i => {
    try { const s = await getDoc(doc(db, 'users', i)); names[i] = s.exists() ? s.data().displayName : 'User'; }
    catch { names[i] = 'User'; }
  }));
}

/* ---------- auth ---------- */
const friendly = c => ({
  'auth/invalid-credential': 'Wrong email or password.',
  'auth/email-already-in-use': 'This email already has an account. Please sign in.',
  'auth/weak-password': 'Password needs 6 or more characters.',
  'auth/invalid-email': 'This email is not valid.',
  'auth/operation-not-allowed': 'Email login is not turned on in Firebase yet.',
  'auth/network-request-failed': 'No internet. Try again.'
}[c] || 'Something went wrong (' + c + ')');

async function doAuth(up) {
  const email = $('#em').value.trim(), pw = $('#pw').value; $('#aerr').textContent = '';
  if (!email || pw.length < 6) { $('#aerr').textContent = 'Enter an email and a password of 6+ characters.'; return; }
  try { up ? await createUserWithEmailAndPassword(auth, email, pw) : await signInWithEmailAndPassword(auth, email, pw); }
  catch (e) { $('#aerr').textContent = friendly(e.code); }
}
$('#bin').onclick = () => doAuth(false);
$('#bup').onclick = () => doAuth(true);
$('#out').onclick = () => signOut(auth);

onAuthStateChanged(auth, async u => {
  if (!u) {
    me = prof = cur = null; if (unC) unC(); if (unL) unL(); unC = unL = null; show('vauth'); return;
  }
  if (me && me.uid === u.uid) return;
  me = u;
  try {
    const s = await getDoc(doc(db, 'users', u.uid));
    if (!s.exists()) return show('vsetup');
    prof = s.data(); names[u.uid] = prof.displayName; home();
  } catch (e) { $('#aerr').textContent = 'Could not load your profile (' + e.code + ')'; show('vauth'); }
});

$('#bsave').onclick = async () => {
  const username = $('#un').value.trim().toLowerCase(), displayName = $('#dn').value.trim();
  if (!/^[a-z0-9_]{3,20}$/.test(username) || !displayName) { $('#serr').textContent = 'Username: 3-20 letters, numbers or _. Display name is required.'; return; }
  try {
    await runTransaction(db, async t => {
      const un = doc(db, 'usernames', username);
      if ((await t.get(un)).exists()) throw new Error('taken');
      t.set(un, { uid: me.uid });
      t.set(doc(db, 'users', me.uid), { username, displayName });
    });
    prof = { username, displayName }; names[me.uid] = displayName; home();
  } catch (e) { $('#serr').textContent = e.message === 'taken' ? 'That username is taken. Try another.' : 'Could not save (' + (e.code || e.message) + ')'; }
};

/* ---------- home ---------- */
function home() {
  show('vhome');
  if (unL) unL();
  unL = onSnapshot(query(collection(db, 'chats'), where('members', 'array-contains', me.uid)), snap => renderList(snap.docs),
    () => { $('#list').textContent = 'Could not load chats. Check your internet.'; });
  const j = new URLSearchParams(location.search).get('join');
  if (j) { history.replaceState(null, '', location.pathname); joinLink(j); }
}
async function renderList(docs) {
  const items = docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ((b.createdAt && b.createdAt.seconds) || 9e12) - ((a.createdAt && a.createdAt.seconds) || 9e12));
  await ensureNames(items.filter(c => !c.isGroup).map(c => c.members.find(m => m !== me.uid)));
  const L = $('#list'); L.textContent = '';
  if (!items.length) { L.append(el('p', 'empty', 'No chats yet. Search a username above or create a group.')); return; }
  items.forEach(c => {
    const t = c.isGroup ? c.name : (names[c.members.find(m => m !== me.uid)] || 'Chat');
    L.append(row(t, c.isGroup ? 'Group, ' + c.members.length + ' members' : '', () => openChat(c, t)));
  });
}

let st;
$('#q').oninput = () => { clearTimeout(st); st = setTimeout(search, 300); };
async function search() {
  const q = $('#q').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, ''), R = $('#res'); R.textContent = '';
  if (q.length < 2) return;
  try {
    const s = await getDocs(query(collection(db, 'users'), where('username', '>=', q), where('username', '<=', q + '\uf8ff'), limit(10)));
    let n = 0;
    s.forEach(d => { if (d.id === me.uid) return; n++; const p = d.data(); R.append(row(p.displayName, '@' + p.username, () => startDM(d.id, p.displayName))); });
    if (!n) R.append(el('p', 'empty', 'No user found with that username.'));
  } catch (e) { R.append(el('p', 'empty', 'Search failed (' + e.code + ')')); }
}
async function startDM(other, title) {
  const m = [me.uid, other].sort(), id = m.join('_'), ref = doc(db, 'chats', id);
  try { const s = await getDoc(ref); if (!s.exists()) await setDoc(ref, { isGroup: false, members: m, createdAt: serverTimestamp() }); }
  catch (e) { return alert('Could not start chat (' + e.code + ')'); }
  $('#q').value = ''; $('#res').textContent = '';
  openChat({ id, isGroup: false, members: m }, title);
}
$('#bgrp').onclick = async () => {
  const n = (prompt('Group name') || '').trim().slice(0, 60); if (!n) return;
  try {
    const r = await addDoc(collection(db, 'chats'), { isGroup: true, name: n, members: [me.uid], createdBy: me.uid, createdAt: serverTimestamp() });
    openChat({ id: r.id, isGroup: true, name: n, members: [me.uid] }, n);
  } catch (e) { alert('Could not create group (' + e.code + ')'); }
};
async function joinLink(id) {
  try {
    const ref = doc(db, 'chats', id), s = await getDoc(ref);
    if (!s.exists() || !s.data().isGroup) return alert('This invite link is not valid.');
    const c = { id, ...s.data() };
    if (c.members.includes(me.uid)) return openChat(c, c.name);
    if (!confirm('Join the group "' + c.name + '"?')) return;
    await updateDoc(ref, { members: arrayUnion(me.uid) });
    openChat(c, c.name);
  } catch (e) { alert('Could not join (' + e.code + ')'); }
}

/* ---------- chat ---------- */
function openChat(c, title) {
  cur = c; $('#ct').textContent = title; $('#inv').hidden = !c.isGroup; $('#msgs').textContent = ''; show('vchat');
  if (unC) unC();
  unC = onSnapshot(query(collection(db, 'chats', c.id, 'messages'), orderBy('createdAt', 'desc'), limit(50)), async snap => {
    const ms = snap.docs.map(d => ({ id: d.id, pending: d.metadata.hasPendingWrites, ...d.data({ serverTimestamps: 'estimate' }) })).reverse();
    await ensureNames(ms.map(m => m.senderId));
    if (cur && cur.id === c.id) renderMsgs(ms);
  }, () => { $('#msgs').textContent = ''; $('#msgs').append(el('p', 'empty', 'Could not load messages. Go back and try again.')); });
}
function renderMsgs(ms) {
  currentMessages=ms; const filter=($('#chatQuery')?.value||'').trim().toLowerCase();
  const M=$('#msgs'), near=M.scrollHeight-M.scrollTop-M.clientHeight<150; M.textContent='';
  ms.filter(m=>!filter||(m.text||'').toLowerCase().includes(filter)).forEach(m=>{
    const mine=m.senderId===me.uid,d=el('div','msg'+(mine?' me':'')); d.dataset.id=m.id;
    if(cur.isGroup&&!mine)d.append(el('b','who',names[m.senderId]||'Member'));
    if(m.replyTo)d.append(el('div','reply-preview','↩ '+(m.replyTo.text||'Message').slice(0,90)));
    d.append(el('span','',m.deleted?'This message was deleted.':(m.text||'')));
    d.append(el('i','time',(m.pending?'Sending...':(m.createdAt&&m.createdAt.toDate?m.createdAt.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''))+(m.edited?' · edited':'')));
    if(m.reaction)d.append(el('span','reaction',m.reaction));
    if(!m.deleted){const a=el('div','msg-tools'); const r=el('button','','↩');r.onclick=()=>setReply(m);const x=el('button','','☺');x.onclick=()=>reactMsg(m);const cp=el('button','','Copy');cp.onclick=()=>navigator.clipboard?.writeText(m.text||'');a.append(r,x,cp);if(mine){const ed=el('button','','Edit');ed.onclick=()=>editMsg(m);const dl=el('button','','Delete');dl.onclick=()=>removeMsg(m);a.append(ed,dl)}d.append(a)}
    M.append(d);
  }); if(near)M.scrollTop=M.scrollHeight;
}
function setReply(m){replyTo={id:m.id,text:m.text||''};$('#replyText').textContent='Replying: '+(m.text||'').slice(0,80);$('#replybar').hidden=false;$('#in').focus()}
async function editMsg(m){const v=prompt('Edit message',m.text||'');if(v===null||!v.trim())return;try{await updateDoc(doc(db,'chats',cur.id,'messages',m.id),{text:v.trim(),edited:true})}catch(e){alert('Could not edit ('+e.code+')')}}
async function removeMsg(m){if(!confirm('Delete this message for everyone?'))return;try{await updateDoc(doc(db,'chats',cur.id,'messages',m.id),{text:'',deleted:true})}catch(e){alert('Could not delete ('+e.code+')')}}
async function reactMsg(m){const v=prompt('Reaction: ❤️  👍  😂  😮  😢  🔥','❤️');if(!v)return;try{await updateDoc(doc(db,'chats',cur.id,'messages',m.id),{reaction:v.slice(0,4)})}catch(e){alert('Could not react ('+e.code+')')}}
$('#f').onsubmit = e => {
  e.preventDefault();
  const i = $('#in'), text = i.value.trim(); if (!text || !cur) return; i.value = '';
  addDoc(collection(db, 'chats', cur.id, 'messages'), { senderId: me.uid, text, createdAt: serverTimestamp(), replyTo: replyTo ? {id:replyTo.id,text:replyTo.text} : null })
    .catch(() => alert('Message not sent. Check your internet and try again.'));
};
$('#cancelReply').onclick=()=>{replyTo=null;$('#replybar').hidden=true}; $('#searchChat').onclick=()=>{$('#chatSearch').hidden=!$('#chatSearch').hidden; if(!$('#chatSearch').hidden)$('#chatQuery').focus()}; $('#chatQuery').oninput=()=>renderMsgs(currentMessages); $('#profileBtn').onclick=()=>{const n=prompt('Display name',prof?.displayName||'');if(n&&n.trim())updateDoc(doc(db,'users',me.uid),{displayName:n.trim()}).then(()=>{prof.displayName=n.trim();names[me.uid]=n.trim()}).catch(e=>alert('Could not update ('+e.code+')'))};
$('#back').onclick = () => { if (unC) { unC(); unC = null; } cur = null; show('vhome'); };
$('#inv').onclick = () => {
  const l = location.origin + location.pathname + '?join=' + cur.id;
  if (navigator.clipboard) navigator.clipboard.writeText(l).then(() => alert('Invite link copied. Share it with people you want in this group.'), () => prompt('Copy invite link', l));
  else prompt('Copy invite link', l);
};

<script>if('serviceWorker' in navigator){window.addEventListener('load',async()=>{try{const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){if(new URL(r.scope).pathname.includes('/qavli/'))await r.unregister()}for(const k of await caches.keys()){if(k.startsWith('qavli-shell-'))await caches.delete(k)}await navigator.serviceWorker.register('sw.js?v=3')}catch(e){}})}</script>
