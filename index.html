import 'dart:math';
import 'package:flutter/material.dart';

void main() {
  runApp(const MotivationalApp());
}

class MotivationalApp extends StatelessWidget {
  const MotivationalApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'Daily Motivation',
      theme: ThemeData(
        fontFamily: 'Roboto',
        useMaterial3: true,
      ),
      home: const QuoteScreen(),
    );
  }
}

class QuoteScreen extends StatefulWidget {
  const QuoteScreen({super.key});

  @override
  State<QuoteScreen> createState() => _QuoteScreenState();
}

class _QuoteScreenState extends State<QuoteScreen> {
  // List of motivational quotes
  final List<Map<String, String>> _quotes = [
    {
      "quote": "The only way to do great work is to love what you do.",
      "author": "Steve Jobs"
    },
    {
      "quote": "Believe you can and you're halfway there.",
      "author": "Theodore Roosevelt"
    },
    {
      "quote": "Action is the foundational key to all success.",
      "author": "Pablo Picasso"
    },
    {
      "quote": "Your limitation—it's only your imagination.",
      "author": "Anonymous"
    },
    {
      "quote": "Push yourself, because no one else is going to do it for you.",
      "author": "Anonymous"
    },
  ];

  // List of modern gradient backgrounds
  final List<List<Color>> _gradients = [
    [const Color(0xFF8A2387), const Color(0xFFE94057), const Color(0xFFF27121)],
    [const Color(0xFF00B4DB), const Color(0xFF0083B0)],
    [const Color(0xFF11998E), const Color(0xFF38EF7D)],
    [const Color(0xFF0F2027), const Color(0xFF203A43), const Color(0xFF2C5364)],
  ];

  int _currentIndex = 0;
  int _currentGradientIndex = 0;

  void _nextQuote() {
    setState(() {
      _currentIndex = Random().nextInt(_quotes.length);
      _currentGradientIndex = Random().nextInt(_gradients.length);
    });
  }

  @override
  Widget build(BuildContext context) {
    final currentQuote = _quotes[_currentIndex];

    return Scaffold(
      body: AnimatedContainer(
        duration: const Duration(milliseconds: 600),
        curve: Curves.easeInOut,
        decoration: BoxDecoration(
          gradient: LinearGradient(
            colors: _gradients[_currentGradientIndex],
            begin: Alignment.topLeft,
            end: Alignment.bottomRight,
          ),
        ),
        child: SafeArea(
          child: Padding(
            padding: const EdgeInsets.symmetric(horizontal: 24.0, vertical: 16.0),
            child: Column(
              mainAxisAlignment: MainAxisAlignment.spaceBetween,
              children: [
                // Top Bar
                Row(
                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                  children: [
                    const Text(
                      'MOTIVATION',
                      style: TextStyle(
                        color: Colors.white70,
                        fontSize: 14,
                        fontWeight: FontWeight.bold,
                        letterSpacing: 2.0,
                      ),
                    ),
                    IconButton(
                      icon: const Icon(Icons.share, color: Colors.white70),
                      onPressed: () {
                        // Add share functionality here
                      },
                    ),
                  ],
                ),

                // Quote Card Area
                Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    const Icon(
                      Icons.format_quote_rounded,
                      size: 60,
                      color: Colors.white38,
                    ),
                    const SizedBox(height: 16),
                    Text(
                      '"${currentQuote['quote']}"',
                      textAlign: TextAlign.center,
                      style: const TextStyle(
                        color: Colors.white,
                        fontSize: 28,
                        fontWeight: FontWeight.w600,
                        height: 1.3,
                      ),
                    ),
                    const SizedBox(height: 20),
                    Text(
                      "- ${currentQuote['author']}",
                      style: const TextStyle(
                        color: Colors.white80,
                        fontSize: 16,
                        fontStyle: FontStyle.italic,
                        letterSpacing: 1.1,
                      ),
                    ),
                  ],
                ),

                // Action Button
                SizedBox(
                  width: double.infinity,
                  height: 56,
                  child: ElevatedButton(
                    onPressed: _nextQuote,
                    style: ElevatedButton.styleFrom(
                      backgroundColor: Colors.white,
                      foregroundColor: Colors.black80,
                      elevation: 4,
                      shape: RoundedRectangleBorder(
                        borderRadius: BorderRadius.circular(30),
                      ),
                    ),
                    child: const Text(
                      'Inspire Me',
                      style: TextStyle(
                        fontSize: 18,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                  ),
                ),
              ],
            ),
          ),
        ),
      ),
    );
  }
}
