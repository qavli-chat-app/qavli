name: QAVLI quality checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["qavli-pro-hardening"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test Firestore security rules in emulator
        run: npx firebase emulators:exec --only firestore --project demo-qavli "npm test"
